# 홈 화면 구성 파일. sections의 순서가 화면 순서이고, enabled: false로 섹션을 숨긴다.
# 종류: hero, projects, technologies, interviews, contact. 같은 종류를 여러 번 쓸 수 있지만 id는 겹치면 안 된다.
# 사진과 영상은 product/assets/ 또는 product/media/ 아래 파일(/assets/..., /media/...)이나 HTTPS 주소를 쓴다.
# 사용법: docs/design/home-config.md

sections:
  # 히어로: 아이콘, 소개, 동영상, 포스터, 액션을 한 묶음으로 바꾼다.
  # title은 선택이다. 페이지 제목과 아이콘 대체 글로 쓰이고, icon이 없을 때는 아이콘 자리에 화면 제목으로 보인다.
  - id: hero
    type: hero
    enabled: true
    title: 최우녕
    description: 흩어진 지식을 연결해, 다시 꺼내 쓸 수 있는 도구를 만듭니다.
    icon:
      src: /assets/hero-logo-things-io90.png
      alt: Things 임시 로고
    # image: 동영상이 없을 때 소개 아래에 큰 이미지를 보인다.
    # image:
    #   src: /assets/meettheallnewthings2-io75.jpg
    #   alt: 설명
    video:
      src: /media/manta-code-blocks-intro-web.mp4
      poster: /media/manta-code-blocks-poster.png
      title: Manta Code Blocks
    # action: 영상이 있으면 재생 버튼의 문구. href를 쓰면 그 주소로 가는 링크가 된다.
    action:
      label: 프로젝트 영상 보기

  # 프로젝트: items에 항목을 추가하면 같은 모양의 소개 구간이 늘어난다. 지금은 더미 2개다.
  # 링크 문구는 link.label, 이동 주소는 link.href이다. 예: label: 기능 보기, href: /docs/
  # 이미지와 아이콘은 자체 placeholder이므로 실제 프로젝트 자산으로 바꾼다.
  - id: projects
    type: projects
    enabled: true
    items:
      - title: 더미 제목
        description: 프로젝트 내용을 설명하세요.
        link:
          label: 자세히 보기
          href: /docs/
        icon:
          src: /assets/project-placeholder-icon.svg
          alt: ""
        image:
          src: /assets/project-placeholder.svg
          alt: 더미 프로젝트 이미지
      - title: 더미 제목
        description: 프로젝트 내용을 설명하세요.
        link:
          label: 자세히 보기
          href: /blog/
        icon:
          src: /assets/project-placeholder-icon.svg
          alt: ""
        image:
          src: /assets/project-placeholder.svg
          alt: 더미 프로젝트 이미지

  # 기술: 아이콘, 제목, 설명을 가진 머리 아래에 기술 로고가 흐른다. items는 아이콘 카탈로그의 이름이고
  # 아이콘을 누르면 같은 태그의 글로 간다. title과 description을 생략하면 기본 문구를 쓴다.
  - id: technologies
    type: technologies
    enabled: true
    icon:
      src: /assets/technology-keycap-icon.svg
      alt: ""
    title: 함께 쓰는 기술
    description: 기술별 기록을 모았습니다.
    items: [c, csharp, python, typescript, javascript, kotlin, postgresql, kubernetes, docker, git]

  # 인터뷰: 머리(icon, title, description, links) 아래에 카드가 흐른다.
  # links는 {label, href?, icon?}이다. icon은 github, rss, linkedin 또는 이미지 파일이고 생략하면 label이 글자로 보인다.
  # 내장 아이콘은 href를 비워 둘 수 있다. 그러면 아이콘만 보이고 링크가 되지 않으며 주소가 생기면 href만 채운다.
  # 카드는 요약(summary)과 그 아래 세 자리 profile(image, title, subtitle)이다. 의미는 설정이 정한다.
  # url은 선택이며 title에 연결되고 별도 줄을 만들지 않는다. image가 없으면 그 자리는 비지 않고 사라진다.
  # items가 비어 있으면 미리보기에서만 예시 카드를 보인다.
  # summary 안에서는 [@만난 곳](https://example.com/community)처럼 링크를 쓸 수 있다. 다른 문법은 쓰지 않는다.
  #   - id: company-example
  #     summary: "[@커뮤니티](https://example.com/community)에서 함께했습니다."
  #     profile: { image: { src: /assets/company.png, alt: "" }, title: 회사명, subtitle: 직무 }
  #   - id: platform-example
  #     summary: 선별해 정리한 요약
  #     profile: { image: { src: /assets/profile.png, alt: "" }, title: "@github-id", subtitle: "2026-01-15" }
  #     url: https://github.com/github-id/repo/discussions/1
  - id: interviews
    type: interviews
    enabled: true
    icon:
      src: /assets/fancysection-icon-whatpeoplearesaying-io70.png
      alt: ""
    title: 사람들이 하는 말
    description: 동료평가 소개 섹션입니다.
    links:
      - { label: GitHub, href: "https://github.com/woonyong-choi", icon: github }
      - { label: LinkedIn, icon: linkedin }
    items: []

  # 연락: mode가 email이면 메일 버튼, newsletter이면 구독 입력을 보인다.
  # endpoint(HTTPS 주소)를 쓰기 전에는 입력과 버튼이 비활성이고 어떤 주소도 저장하거나 보내지 않는다.
  - id: contact
    type: contact
    enabled: true
    mode: newsletter
    title: 소식 받아보기
    description: 새 글과 프로젝트 소식을 이메일로 보내 드립니다.
    button: 구독
    icon:
      src: /assets/fancysection-icon-newsletter-io70.png
      alt: ""
    email: woonyong.contact@gmail.com
    # endpoint: https://subscribe.example.com/form
    # field: email
    # note: 구독 안내 문구
    # privacy:
    #   label: 개인정보 처리방침
    #   href: /privacy/
